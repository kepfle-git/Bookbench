# Windows-Setup bauen und als Release-Entwurf anlegen (läuft nur im Release-Repo kepfle-git/Bookbench).
#
# Auslöser: Push eines Tags v<Version> (z. B. v1.2, v1.3-beta1) oder von Hand unter
# Actions > Windows-Setup > Run workflow mit dem Tag als Eingabe (auch für schon vorhandene Tags).
#
# Ergebnis: Release-Entwurf "Bookbench <Version>" zum Tag mit Bookbench_Setup_<Version>.exe und SHA256SUMS;
# Text aus .github/release-notes/<Version>.md (englisch, wird mit dem Release erstellt), sonst ein Platzhalter.
# Beginnt der Text mit "**Titel**" (fertige Versionen, seit 1.3), heißt der Release "Bookbench <Version> – Titel".
# Gibt es zum Tag schon eine Veröffentlichung (auch veröffentlicht, z. B. von Hand über "Draft a new
# release" mit Tag und Titel angelegt), werden die Dateien dort angehängt bzw. ersetzt; ist ihr Text
# leer, kommt der Release-Text hinein, ein schlichter Titel ("Bookbench 1.3") bekommt den Versionstitel. Text schreiben, ggf. "Vorabversion" anhaken und veröffentlichen macht
# der Nutzer selbst; Entwürfe sieht der Updater nicht.
#
# Später: Signieren über SignPath als Schritt zwischen "Setup bauen" und "Prüfsummen".
name: Windows-Setup
run-name: Windows-Setup ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*", "V*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, z. B. v1.2"
        required: true

permissions:
  contents: write

jobs:
  setup:
    if: github.repository == 'kepfle-git/Bookbench'
    runs-on: windows-latest
    env:
      EINGABE: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
    steps:
      # Tags unterscheiden Groß/klein (V1.2 ist nicht v1.2); von Hand eingegeben wird oft anders
      # geschrieben. Deshalb erst den tatsächlichen Tag suchen und klar melden, wenn es ihn nicht gibt.
      - name: Tag suchen
        shell: pwsh
        run: |
          $tags = git ls-remote --tags "https://github.com/$env:GITHUB_REPOSITORY" |
            ForEach-Object { ($_ -split "`t")[1] -replace '^refs/tags/', '' } |
            Where-Object { $_ -notlike '*^{}' }
          $tag = $tags | Where-Object { $_ -ieq $env:EINGABE.Trim() } | Select-Object -First 1
          if (-not $tag) {
            Write-Error ("Tag '$env:EINGABE' gibt es im Repo nicht. Erst den Tag anlegen (auf den neuesten Commit von main). " +
                         "Vorhanden: " + ($tags -join ', '))
            exit 1
          }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Tag: $tag"

      - name: Quelltext zum Tag holen
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Workflow im Tag vorhanden?
        shell: pwsh
        run: |
          if (-not (Test-Path packaging/bookbench.spec)) {
            Write-Error "Der Tag $env:TAG zeigt auf einen Stand ohne packaging/ - Tag auf den neuesten Commit von main setzen."
            exit 1
          }

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Version mit dem Tag vergleichen
        shell: pwsh
        run: |
          $version = (python packaging/version.py).Trim()
          $ausTag = $env:TAG -replace '^[vV]', ''
          if ($version -ne $ausTag) {
            Write-Error "Tag $env:TAG passt nicht zu VERSION = `"$version`" in bookbench/ui/help.py"
            exit 1
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe nicht gefunden"; exit 1 }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Programm bauen (PyInstaller)
        working-directory: packaging
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller -r ../requirements.txt
          python -m PyInstaller --noconfirm --clean bookbench.spec
          if (-not (Test-Path dist/Bookbench/Bookbench.exe)) { Write-Error "Bookbench.exe fehlt"; exit 1 }

      - name: Setup bauen (Inno Setup)
        working-directory: packaging
        shell: pwsh
        run: |
          & $env:ISCC "/DAppVersion=$env:VERSION" bookbench.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prüfsummen (SHA256SUMS)
        working-directory: packaging/dist
        shell: python
        run: |
          import hashlib, os
          name = f"Bookbench_Setup_{os.environ['VERSION']}.exe"
          with open(name, "rb") as f:
              summe = hashlib.sha256(f.read()).hexdigest()
          with open("SHA256SUMS", "w", encoding="utf-8", newline="\n") as f:
              f.write(f"{summe}  {name}\n")
          print(summe, name)

      - name: Als Artefakt ablegen (zum Nachsehen, 14 Tage)
        uses: actions/upload-artifact@v4
        with:
          name: Bookbench_Setup_${{ env.VERSION }}
          path: |
            packaging/dist/Bookbench_Setup_*.exe
            packaging/dist/SHA256SUMS
          retention-days: 14

      - name: Release-Entwurf anlegen bzw. Dateien anhängen
        working-directory: packaging/dist
        shell: pwsh
        run: |
          $setup = "Bookbench_Setup_$env:VERSION.exe"
          $notizen = "$env:GITHUB_WORKSPACE/.github/release-notes/$env:VERSION.md"
          $titel = "Bookbench $env:VERSION"
          $hat_text = Test-Path $notizen
          if ($hat_text) {
            # Titel fertiger Versionen: Release-Text beginnt mit "**Titel**" -> "Bookbench 1.3 – Titel"
            $erste = Get-Content -Path $notizen -Encoding utf8 -TotalCount 1
            if ($erste -match '^\*\*(.+?)\*\*') { $titel = "Bookbench $env:VERSION $([char]0x2013) $($Matches[1])" }
          } else {
            $notizen = "$env:RUNNER_TEMP/notes.md"
            "Windows-Setup und SHA256SUMS automatisch gebaut. Text ergänzen, ggf. *Vorabversion* anhaken, dann veröffentlichen." |
              Out-File -FilePath $notizen -Encoding utf8
          }
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $setup SHA256SUMS --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Release schon von Hand angelegt (z. B. über "Draft a new release" mit Tag und Titel):
            # leeren Text durch den Release-Text ersetzen, schlichten Titel durch den mit Versionstitel.
            # Selbst geschriebener Text und eigene Titel bleiben.
            $info = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json body,name | ConvertFrom-Json
            $schlicht = @("", $env:TAG, $env:VERSION, "Bookbench $env:VERSION", "Bookbench $env:TAG")
            $aendern = @()
            if ($hat_text -and -not "$($info.body)".Trim()) { $aendern += @("--notes-file", $notizen) }
            if ($schlicht -contains "$($info.name)".Trim()) { $aendern += @("--title", $titel) }
            if ($aendern.Count) { gh release edit $env:TAG @aendern --repo $env:GITHUB_REPOSITORY }
          } else {
            gh release create $env:TAG $setup SHA256SUMS --draft --verify-tag --title $titel --notes-file $notizen --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
